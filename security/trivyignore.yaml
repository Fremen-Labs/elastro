# Documented, time-boxed suppressions for ReleaseFlow/Trivy scans.
# Runtime dependencies are patched in PR-SEC-1/2; entries here are dev-only toolchain.
vulnerabilities:
  - id: GHSA-gv7w-rqvm-qjhr
    paths:
      - "packages/gui/package-lock.json"
    statement: >-
      Dev-only esbuild via vite build toolchain; not shipped in elastro-client wheel
      or GUI production bundle. Mitigation: CI uses npm audit --omit=dev for runtime gate.
    expired_at: 2026-12-31
  - id: GHSA-g7r4-m6w7-qqqr
    paths:
      - "packages/gui/package-lock.json"
    statement: >-
      Dev-only esbuild/vite local dev server issue on Windows; Elastro GUI build uses
      production vite build only in CI/release. Upgrade path: vite@8 when stable.
    expired_at: 2026-12-31
  - id: CVE-2026-112940
    paths:
      - "uv.lock"
    statement: >-
      filelock 4.1.0 is only the Python 3.10 resolution of cachecontrol's optional
      filecache extra (pip-audit toolchain). 4.2.1 dropped requires-python to >=3.11,
      so the 3.10 lock marker cannot be patched without dropping 3.10. filelock is
      not a runtime dependency of elastro-client; 3.11+ already resolves 4.3.1.
    expired_at: 2026-12-31