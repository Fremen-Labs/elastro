name: filebeat-logs
description: ILM and index template for Filebeat / logs-filebeat data streams
aliases:
  - filebeat
index_patterns:
  - logs-filebeat*
ilm:
  policy_name: elastro-filebeat-logs
  policy:
    phases:
      hot:
        min_age: 0ms
        actions:
          rollover:
            max_primary_shard_size: 50gb
            max_age: 1d
          set_priority:
            priority: 100
      warm:
        min_age: 1d
        actions:
          set_priority:
            priority: 50
          readonly: {}
          forcemerge:
            max_num_segments: 1
      delete:
        min_age: 30d
        actions:
          delete: {}
template:
  index_patterns:
    - logs-filebeat*
  data_stream: {}
  priority: 100
  _meta:
    managed_by: elastro
    coverage_template: filebeat-logs
  template:
    settings:
      index.lifecycle.name: elastro-filebeat-logs
      index.number_of_shards: 1
      index.refresh_interval: 5s
    mappings:
      properties:
        "@timestamp":
          type: date
        host:
          properties:
            name:
              type: keyword
            hostname:
              type: keyword
        service:
          properties:
            name:
              type: keyword
        log:
          properties:
            file:
              properties:
                path:
                  type: keyword
        agent:
          properties:
            type:
              type: keyword
