name: apm-metrics
description: Shorter-retention ILM and template for APM metrics (metrics-apm*)
aliases: []
index_patterns:
  - metrics-apm*
ilm:
  policy_name: elastro-apm-metrics
  policy:
    phases:
      hot:
        min_age: 0ms
        actions:
          rollover:
            max_primary_shard_size: 20gb
            max_age: 12h
          set_priority:
            priority: 100
      warm:
        min_age: 12h
        actions:
          set_priority:
            priority: 50
          readonly: {}
          forcemerge:
            max_num_segments: 1
      delete:
        min_age: 14d
        actions:
          delete: {}
template:
  index_patterns:
    - metrics-apm*
  data_stream: {}
  priority: 180
  _meta:
    managed_by: elastro
    coverage_template: apm-metrics
  template:
    settings:
      index.lifecycle.name: elastro-apm-metrics
      index.number_of_shards: 1
      index.number_of_replicas: 1
      index.refresh_interval: 10s
    mappings:
      properties:
        "@timestamp":
          type: date
        service:
          properties:
            name:
              type: keyword
            environment:
              type: keyword
        host:
          properties:
            name:
              type: keyword
        metricset:
          properties:
            name:
              type: keyword
